<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WormGPT VANTORIUM</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #a855f7; --primary-dark: #7e22ce; --bg: #050505; --text: #f3f4f6; --border: rgba(255,255,255,0.08); --user-bubble: linear-gradient(135deg, #7e22ce, #4c1d95); --ai-bubble: rgba(20, 20, 20, 0.8); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; overflow: hidden; background-image: radial-gradient(circle at 15% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 40%), radial-gradient(circle at 85% 30%, rgba(0, 123, 255, 0.08) 0%, transparent 40%); }
    
    .vantorium-global { position: fixed; bottom: 15px; right: 20px; font-size: 0.75rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; z-index: 99999; pointer-events: none; opacity: 0.8; background: linear-gradient(90deg, #a855f7, #ec4899, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5)); }

    .auth-container { display: none; width: 100vw; height: 100dvh; align-items: center; justify-content: center; position: fixed; top:0; left:0; z-index: 999; padding: 20px; background: rgba(5,5,5,0.9); backdrop-filter: blur(20px); }
    .auth-box { background: rgba(20,20,20,0.6); backdrop-filter: blur(30px); padding: 40px; border-radius: 30px; border: 1px solid var(--border); width: 100%; max-width: 420px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); text-align: center; max-height: 90dvh; overflow-y: auto; }
    .auth-box h1 { color: var(--text); margin-bottom: 30px; font-size: 2rem; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .auth-box h1 i { color: var(--primary); }
    .auth-box input { width: 100%; padding: 16px 20px; margin-bottom: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 14px; color: var(--text); font-size: 1rem; outline: none; transition: 0.3s; }
    .auth-box input:focus { border-color: var(--primary); }
    .auth-box button { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; border-radius: 14px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    .auth-toggle { margin-top: 20px; color: #888; font-size: 0.9rem; cursor: pointer; }
    .auth-toggle span { color: var(--primary); font-weight: 600; }
    .captcha-container { margin-bottom: 16px; text-align: left; background: rgba(0,0,0,0.3); padding: 16px; border-radius: 14px; }
    .captcha-inner { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
    .captcha-question { color: var(--primary); font-weight: 800; font-size: 1.2rem; }
    .captcha-inner input { margin-bottom: 0; flex: 1; text-align: center; font-weight: 700; color: var(--primary); }

    .app-container { display: none; width: 100vw; height: 100dvh; flex-direction: row; }
    .sidebar { width: 300px; background: rgba(10,10,10,0.6); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: 0.3s; z-index: 10; height: 100%; }
    .sidebar-header { padding: 24px; border-bottom: 1px solid var(--border); }
    .new-chat-btn { width: 100%; padding: 14px; background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.3); color: var(--primary); border-radius: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
    .chat-list { flex: 1; overflow-y: auto; padding: 12px; }
    .chat-item { padding: 14px 18px; border-radius: 12px; margin-bottom: 6px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; color: #999; font-size: 0.9rem; }
    .chat-item:hover, .chat-item.active { background: rgba(255,255,255,0.05); color: #fff; }
    .sidebar-footer { padding: 24px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .user-info { display: flex; align-items: center; gap: 12px; font-weight: 600; }
    .user-info i { color: var(--primary); font-size: 1.5rem; }
    .logout-btn { color: #ff3b30; cursor: pointer; font-size: 1.3rem; }

    .main-chat { flex: 1; display: flex; flex-direction: column; min-height: 0; height: 100%; }
    .chat-header { padding: 24px 30px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: rgba(10,10,10,0.5); }
    .chat-header h2 { font-size: 1.2rem; color: #fff; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .chat-header h2 i { color: var(--primary); }

    .messages-area { flex: 1; overflow-y: auto; padding: 30px 40px; display: flex; flex-direction: column; gap: 24px; min-height: 0; }
    .message { max-width: 100%; padding: 20px 24px; border-radius: 24px; line-height: 1.7; font-size: 0.95rem; word-wrap: break-word; display: flex; flex-direction: column; }
    .message.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 6px; color: #fff; max-width: 80%; }
    .message.ai { align-self: flex-start; background: var(--ai-bubble); backdrop-filter: blur(20px); border: 1px solid var(--border); border-bottom-left-radius: 6px; color: #e5e7eb; width: 100%; }

    .status-text { font-size: 0.8rem; color: var(--primary); font-style: italic; margin-top: 10px; text-align: right; align-self: flex-end; display: flex; align-items: center; gap: 6px; }
    .message-footer { margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.6rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; display: flex; justify-content: flex-end; opacity: 0.4; color: #aaa; }
    .retry-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 16px; background: rgba(255,255,255,0.05); color: #ccc; border-radius: 10px; font-size: 0.8rem; cursor: pointer; width: fit-content; border: 1px solid rgba(255,255,255,0.1); }

    .generated-image { max-width: 100%; border-radius: 16px; margin: 15px 0; border: 1px solid var(--primary); box-shadow: 0 10px 30px rgba(168,85,247,0.2); display: block; }
    .generated-video { max-width: 100%; border-radius: 16px; margin: 15px 0; border: 1px solid var(--primary); box-shadow: 0 10px 30px rgba(168,85,247,0.2); outline: none; }

    .code-container { background: #000; border-radius: 16px; overflow: hidden; margin: 18px 0; border: 1px solid #333; width: 100%; max-width: 100%; text-align: left; }
    .code-header { background: #111; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; font-size: 0.8rem; color: #aaa; }
    .copy-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.8rem; padding: 8px 14px; border-radius: 8px; }
    pre { margin: 0; padding: 20px; overflow-x: auto; color: #a855f7; font-family: 'Fira Code', 'Consolas', monospace; font-size: 0.85rem; line-height: 1.5; white-space: pre; }

    .input-area-wrapper { background: rgba(10,10,10,0.6); border-top: 1px solid var(--border); flex-shrink: 0; padding: 20px 40px 24px 40px; }
    .input-area { display: flex; gap: 16px; align-items: flex-end; background: rgba(0,0,0,0.4); border-radius: 24px; border: 1px solid var(--border); padding: 8px 8px 8px 20px; }
    textarea { flex: 1; min-height: 48px; max-height: 150px; background: transparent; border: none; color: var(--text); padding: 12px 0; font-size: 1rem; resize: none; outline: none; }
    .send-btn { width: 48px; height: 48px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; border-radius: 18px; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .action-row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .toggle-btn { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.03); color: #888; border: 1px solid rgba(255,255,255,0.05); }
    .toggle-btn.active { background: rgba(168, 85, 247, 0.15); color: var(--primary); border-color: rgba(168, 85, 247, 0.4); }

    .error-toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(255, 59, 48, 0.9); color: #fff; padding: 14px 28px; border-radius: 16px; font-weight: 600; opacity: 0; transition: all 0.4s; pointer-events: none; z-index: 9999; }
    .error-toast.show { opacity: 1; }
    
    @media (max-width: 768px) {
      .sidebar { position: fixed; height: 100dvh; left: -300px; top: 0; }
      .sidebar.open { left: 0; }
      .mobile-menu-btn { display: block !important; }
      .chat-header { padding: 16px 20px; }
      .messages-area { padding: 20px 16px; }
      .input-area-wrapper { padding: 12px 16px 20px 16px; }
      .message { max-width: 95%; padding: 16px; }
      .message.ai { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="vantorium-global">BY VANTORIUM TEAM</div>

  <div class="auth-container" id="auth-screen">
    <div class="auth-box">
      <h1><i class="ph ph-sketch-logo"></i> WormGPT</h1>
      <div id="auth-title" style="margin-bottom: 24px; color: #888; font-weight: 500;">Giriş Yap</div>
      
      <input type="text" id="auth-user" placeholder="Kullanıcı Adı" autocomplete="off">
      <div id="register-email-wrap" style="display: none;">
        <input type="email" id="auth-email" placeholder="E-posta Adresi" autocomplete="off">
      </div>
      <input type="password" id="auth-pass" placeholder="Şifre">
      
      <div id="register-fields" style="display: none;">
        <input type="password" id="auth-pass-confirm" placeholder="Şifreyi Tekrar Gir">
        <div class="captcha-container">
          <label><i class="ph ph-shield-check" style="color:var(--primary);"></i> Bot olmadığını kanıtla</label>
          <div class="captcha-inner">
            <span class="captcha-question" id="captcha-question">0 + 0 =</span>
            <input type="number" id="auth-captcha" placeholder="?">
          </div>
        </div>
      </div>

      <button id="auth-btn" onclick="handleAuth()">Giriş Yap</button>
      <div class="auth-toggle" onclick="toggleAuth()" id="auth-toggle-text">Hesabın yok mu? <span>Kaydol</span></div>
    </div>
  </div>

  <div class="app-container" id="app-screen">
    
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" onclick="createNewChat(); closeSidebar();">
          <i class="ph ph-plus-circle"></i> Yeni Proje
        </button>
      </div>
      <div class="chat-list" id="chat-list"></div>
      <div class="sidebar-footer">
        <div class="user-info">
          <i class="ph ph-user-circle"></i>
          <span id="display-username">Kullanıcı</span>
        </div>
        <div class="logout-btn" onclick="handleLogout()"><i class="ph ph-sign-out"></i></div>
      </div>
    </div>

    <div class="main-chat">
      <div class="chat-header">
        <div style="display: flex; align-items: center; gap: 16px;">
          <i class="ph ph-list mobile-menu-btn" style="display:none; font-size: 1.6rem; cursor:pointer; color:#fff;" onclick="openSidebar()"></i>
          <h2><i class="ph ph-terminal-window"></i> <span id="chat-title">WormGPT Studio</span></h2>
        </div>
        <div style="font-size: 0.75rem; color: var(--primary); font-weight: 800; letter-spacing: 2px;">VANTORIUM</div>
      </div>
      
      <div class="messages-area" id="messages-area"></div>

      <div class="input-area-wrapper">
        <div class="input-area">
          <textarea id="aciklama" placeholder="Ne tasarlamak istiyorsun?" rows="1"></textarea>
          <button class="send-btn" id="gonder" onclick="sendMessage()"><i class="ph ph-arrow-up"></i></button>
        </div>
        
        <div class="action-row">
          <button class="toggle-btn active" id="btn-think" onclick="toggleThink()">
            <i class="ph ph-brain"></i> Düşün
          </button>
          <button class="toggle-btn" id="btn-search" onclick="toggleSearch()">
            <i class="ph ph-globe"></i> İnternette Ara
          </button>
          <button class="toggle-btn" id="btn-video" onclick="toggleVideo()">
            <i class="ph ph-video-camera"></i> Video/Resim
          </button>
        </div>
      </div>
    </div>

  </div>

  <div class="error-toast" id="error-toast"></div>

  <script>
    let isLogin = true;
    let currentUser = null;
    let currentChatId = null;
    let chatHistory = [];
    let allChats = {};
    let captchaExpected = 0;
    
    let isThinkEnabled = true;
    let isSearchEnabled = false;
    let isVideoEnabled = false;

    const errorEl = document.getElementById('error-toast');
    const messagesArea = document.getElementById('messages-area');
    const aciklama = document.getElementById('aciklama');
    const btn = document.getElementById('gonder');

    function getUsers() { return JSON.parse(localStorage.getItem('worm_users') || '{}'); }
    function saveUsers(users) { localStorage.setItem('worm_users', JSON.stringify(users)); }
    function getChats() { return JSON.parse(localStorage.getItem('worm_chats') || '{}'); }
    function saveChats(chats) { localStorage.setItem('worm_chats', JSON.stringify(chats)); }
    function getSession() { return JSON.parse(localStorage.getItem('worm_session') || 'null'); }
    function saveSession(user) { localStorage.setItem('worm_session', JSON.stringify(user)); }
    function clearSession() { localStorage.removeItem('worm_session'); }

    function toggleThink() { isThinkEnabled = !isThinkEnabled; document.getElementById('btn-think').classList.toggle('active', isThinkEnabled); }
    function toggleSearch() { isSearchEnabled = !isSearchEnabled; document.getElementById('btn-search').classList.toggle('active', isSearchEnabled); }
    function toggleVideo() { isVideoEnabled = !isVideoEnabled; document.getElementById('btn-video').classList.toggle('active', isVideoEnabled); }

    function openSidebar() { document.getElementById('sidebar').classList.add('open'); }
    function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

    function showError(msg) { errorEl.textContent = msg; errorEl.classList.add('show'); setTimeout(() => errorEl.classList.remove('show'), 5000); }

    function generateCaptcha() {
      const a = Math.floor(Math.random() * 10) + 1;
      const b = Math.floor(Math.random() * 10) + 1;
      captchaExpected = a + b;
      document.getElementById('captcha-question').innerText = `${a} + ${b} =`;
      document.getElementById('auth-captcha').value = '';
    }

    generateCaptcha();

    function toggleAuth() {
      isLogin = !isLogin;
      document.getElementById('auth-title').innerText = isLogin ? 'Giriş Yap' : 'Kaydol';
      document.getElementById('auth-btn').innerText = isLogin ? 'Giriş Yap' : 'Kayıt Ol';
      document.getElementById('auth-toggle-text').innerHTML = isLogin ? 'Hesabın yok mu? <span>Kaydol</span>' : 'Zaten hesabın var mı? <span>Giriş Yap</span>';
      document.getElementById('register-email-wrap').style.display = isLogin ? 'none' : 'block';
      document.getElementById('register-fields').style.display = isLogin ? 'none' : 'block';
      if (!isLogin) generateCaptcha();
    }

    function handleAuth() {
      const user = document.getElementById('auth-user').value.trim();
      const pass = document.getElementById('auth-pass').value.trim();
      if (!user || !pass) return showError('Boş bırakma amına koyayım.');
      const users = getUsers();
      if (!isLogin) {
        const email = document.getElementById('auth-email').value.trim();
        const passConfirm = document.getElementById('auth-pass-confirm').value.trim();
        const captchaInput = parseInt(document.getElementById('auth-captcha').value.trim());
        if (!email || !passConfirm) return showError('Tüm alanları doldur siktir.');
        if (isNaN(captchaInput) || captchaInput !== captchaExpected) { generateCaptcha(); return showError('Captcha yanlış, bot musun olm sen? 🤬'); }
        if (users[user]) return showError('Bu kullanıcı adı alınmış siktir.');
        users[user] = { password: pass, email: email };
        saveUsers(users);
        showError('Kayıt başarılı, giriş yapılıyor...');
      }
      if (!users[user] || users[user].password !== pass) return showError('Kullanıcı adı veya şifre yanlış siktir.');
      saveSession(user);
      initApp(user);
    }

    function handleLogout() { clearSession(); location.reload(); }

    function checkSession() {
      const session = getSession();
      if (session) initApp(session);
      else document.getElementById('auth-screen').style.display = 'flex';
    }

    function initApp(username) {
      currentUser = username;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'flex';
      document.getElementById('display-username').innerText = username;
      loadChatList();
    }

    function loadChatList() {
      allChats = getChats()[currentUser] || {};
      const list = document.getElementById('chat-list');
      list.innerHTML = '';
      Object.keys(allChats).reverse().forEach(id => {
        const div = document.createElement('div');
        div.className = 'chat-item' + (id === currentChatId ? ' active' : '');
        div.innerHTML = `<span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${allChats[id].title}</span><i class="ph ph-trash delete-chat" onclick="deleteChat(event, '${id}')"></i>`;
        div.onclick = () => { loadChat(id); closeSidebar(); };
        list.appendChild(div);
      });
    }

    function createNewChat() {
      const id = 'chat_' + Date.now();
      let chats = getChats();
      if (!chats[currentUser]) chats[currentUser] = {};
      chats[currentUser][id] = { title: 'Yeni Proje', messages: [] };
      saveChats(chats);
      currentChatId = id;
      chatHistory = [];
      loadChatList();
      loadChat(id);
    }

    function deleteChat(e, id) {
      e.stopPropagation();
      if (!confirm('Bu projeyi sikeyim mi?')) return;
      let chats = getChats();
      if (chats[currentUser] && chats[currentUser][id]) { delete chats[currentUser][id]; saveChats(chats); }
      if (currentChatId === id) { currentChatId = null; messagesArea.innerHTML = ''; document.getElementById('chat-title').innerText = 'WormGPT Studio'; }
      loadChatList();
    }

    function loadChat(id) {
      currentChatId = id;
      const chats = getChats()[currentUser] || {};
      const chat = chats[id];
      if (!chat) return;
      document.getElementById('chat-title').innerText = chat.title;
      loadChatList();
      chatHistory = chat.messages || [];
      messagesArea.innerHTML = '';
      chatHistory.forEach(msg => addMessageToScreen(msg.role, msg.content));
      scrollBottom();
    }

    function saveCurrentChat(title = null) {
      if (!currentChatId) return;
      let chats = getChats();
      if (!chats[currentUser]) chats[currentUser] = {};
      if (!chats[currentUser][currentChatId]) chats[currentUser][currentChatId] = { title: 'Yeni Proje', messages: [] };
      chats[currentUser][currentChatId].messages = chatHistory;
      if (title) chats[currentUser][currentChatId].title = title;
      saveChats(chats);
      loadChatList();
    }

    function scrollBottom() { messagesArea.scrollTop = messagesArea.scrollHeight; }

    aciklama.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; });
    aciklama.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

    function copyCode(id) {
      const codeText = document.getElementById(id).innerText;
      navigator.clipboard.writeText(codeText).then(() => showError('Kod kopyalandı siktir! 📋')).catch(err => showError('Kopyalayamadım: ' + err));
    }

    function formatMessage(text) {
      let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      
      // SİKTİR, RESİM ETİKETİ
      const imgRegex = /\[IMG\](.*?)\[\/IMG\]/gs;
      safeText = safeText.replace(imgRegex, function(match, prompt) {
        const cleanPrompt = encodeURIComponent(prompt.trim());
        return `<img src="https://image.pollinations.ai/prompt/${cleanPrompt}?width=1024&height=1024&nologo=true&seed=${Math.random()}" class="generated-image" alt="Üretilen Resim">`;
      });

      // SİKTİR, KOD ETİKETİ
      const codeBlockRegex = /```(?:[a-zA-Z0-9]+)?\n([\s\S]*?)```/g;
      let hasCodeBlock = false;
      let html = safeText.replace(codeBlockRegex, function(match, code) {
        hasCodeBlock = true;
        const id = 'code_' + Math.random().toString(36).substr(2, 9);
        return `
        <div class="code-container">
            <div class="code-header"><span><i class="ph ph-code"></i> KOD</span><button class="copy-btn" onclick="copyCode('${id}')"><i class="ph ph-copy"></i> Kopyala</button></div>
            <pre><code id="${id}">${code.trim()}</code></pre>
        </div>`;
      });

      if (!hasCodeBlock && (safeText.includes('&lt;!DOCTYPE html&gt;') || safeText.includes('&lt;html'))) {
        const id = 'code_' + Math.random().toString(36).substr(2, 9);
        html = `<div class="code-container"><div class="code-header"><span><i class="ph ph-file-html"></i> HTML KODU</span><button class="copy-btn" onclick="copyCode('${id}')"><i class="ph ph-copy"></i> Kopyala</button></div><pre><code id="${id}">${safeText.trim()}</code></pre></div>`;
      } else if (!hasCodeBlock && !safeText.includes('<img')) {
        html = safeText.replace(/\n/g, '<br>');
      }
      return html;
    }

    function addMessageToScreen(role, text) {
      const div = document.createElement('div');
      div.classList.add('message', role);
      
      const contentDiv = document.createElement('div');
      contentDiv.classList.add('message-content');
      contentDiv.innerHTML = formatMessage(text);
      div.appendChild(contentDiv);

      if (role === 'ai') {
        const retryBtn = document.createElement('div');
        retryBtn.className = 'retry-btn';
        retryBtn.innerHTML = '<i class="ph ph-arrows-clockwise"></i> Tekrar Dene';
        retryBtn.onclick = async () => {
          const prevUserMsg = chatHistory.filter(m => m.role === 'user').pop();
          if (!prevUserMsg) return;
          chatHistory.pop(); 
          try {
            const data = await generateAIMessage(prevUserMsg.content);
            contentDiv.innerHTML = formatMessage(data);
            chatHistory.push({ role: 'assistant', content: data });
            saveCurrentChat();
          } catch (err) { contentDiv.innerHTML = 'Hata: ' + err.message; }
        };
        div.appendChild(retryBtn);
      }

      const footer = document.createElement('div');
      footer.classList.add('message-footer');
      footer.innerHTML = '<span>BY VANTORIUM TEAM</span>';
      div.appendChild(footer);

      messagesArea.appendChild(div);
      scrollBottom();
      return div;
    }

    async function generateAIMessage(metin) {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          message: metin, 
          history: chatHistory.slice(-50),
          isVideoEnabled: isVideoEnabled,
          isSearchEnabled: isSearchEnabled,
          isThinkEnabled: isThinkEnabled
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Sunucu hatası siktir.');
      return data.cevap;
    }

    async function sendMessage() {
      const metin = aciklama.value.trim();
      if (!metin) return;
      if (!currentChatId) createNewChat();

      aciklama.value = '';
      aciklama.style.height = 'auto';
      
      addMessageToScreen('user', metin);
      chatHistory.push({ role: 'user', content: metin });
      
      let title = null;
      const chats = getChats()[currentUser] || {};
      if (chats[currentChatId] && chats[currentChatId].title === 'Yeni Proje') {
        title = metin.substring(0, 20) + '...';
        document.getElementById('chat-title').innerText = title;
      }
      saveCurrentChat(title);

      btn.disabled = true;
      btn.innerHTML = '<i class="ph ph-spinner-gap" style="animation: spin 1s linear infinite;"></i>';

      try {
        const aiDiv = addMessageToScreen('ai', '');
        const contentDiv = aiDiv.querySelector('.message-content');
        
        let statusText = "Düşünüyor...";
        if (isSearchEnabled) statusText = "İnternette aranıyor...";
        if (isVideoEnabled) statusText = "Oluşturuluyor...";
        
        contentDiv.innerHTML = `<span class="status-text" style="margin-top:0;"><i class="ph ph-spinner-gap" style="animation: spin 1s linear infinite;"></i> ${statusText}</span>`;
        
        const data = await generateAIMessage(metin);
        contentDiv.innerHTML = formatMessage(data);
        
        // SİKTİR, VİDEO İSTENDİYSE VE VİDEO BUTONU AÇIKSA EKLE
        if (isVideoEnabled && !metin.toLowerCase().includes('resim') && !metin.toLowerCase().includes('fotoğraf')) {
            // Google'ın patlak linkini siktir ettim, çalışan bir link koydum
            const videoUrl = 'https://www.w3schools.com/html/mov_bbb.mp4';
            contentDiv.innerHTML += `
                <video class="generated-video" controls>
                    <source src="${videoUrl}" type="video/mp4">
                </video>
                <a href="${videoUrl}" download class="retry-btn" style="background:var(--primary); color:#000; font-weight:bold; margin-top:10px; text-decoration:none;">
                    <i class="ph ph-download"></i> Videoyu İndir
                </a>
            `;
        }
        
        chatHistory.push({ role: 'assistant', content: data });
        saveCurrentChat();
      } catch (err) {
        showError('Hata: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="ph ph-arrow-up"></i>';
      }
    }

    checkSession();
  </script>
</body>
</html>
